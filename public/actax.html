<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actax — Marketing Projects — Mannat</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
        color: rgba(226, 232, 240, 0.96);
        background:
          linear-gradient(180deg, #05060f 0%, #080a14 38%, #0b0f1a 100%),
          radial-gradient(90% 55% at 15% 20%, rgba(88, 28, 135, 0.14), transparent 52%),
          radial-gradient(70% 50% at 85% 75%, rgba(236, 72, 153, 0.08), transparent 48%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 32px) 64px; }
      .back-btn {
        display: inline-flex; align-items: center; gap: 9px;
        padding: 10px 18px; border-radius: 999px;
        font-size: 14px; font-weight: 700; letter-spacing: 0.01em;
        color: rgba(233, 213, 255, 0.98); text-decoration: none;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.28), rgba(99, 102, 241, 0.2));
        border: 1px solid rgba(167, 139, 250, 0.4);
        box-shadow: 0 0 14px rgba(124, 58, 237, 0.15);
        transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      .back-btn:hover {
        transform: translateY(-1px);
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.4), rgba(99, 102, 241, 0.3));
        box-shadow: 0 6px 18px rgba(91, 33, 182, 0.35), 0 0 18px rgba(167, 139, 250, 0.22);
      }
      header { margin-top: clamp(28px, 5vw, 44px); }
      .eyebrow { font-size: clamp(13px, 2.2vw, 15px); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(196, 181, 253, 0.9); }
      h1 {
        margin-top: 10px; font-size: clamp(34px, 7vw, 60px); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em;
        background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 42%, #818cf8 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
      }
      .panel {
        margin-top: clamp(28px, 5vw, 42px); padding: clamp(28px, 5vw, 48px);
        border-radius: 20px; background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(167, 139, 250, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 32px rgba(0, 0, 0, 0.26);
      }
      .panel p { font-size: clamp(14px, 2.4vw, 16px); line-height: 1.6; color: rgba(186, 198, 220, 0.9); }
      .tag { display: inline-block; margin-bottom: 14px; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(245, 208, 254, 0.95); background: rgba(217, 70, 239, 0.14); border: 1px solid rgba(217, 70, 239, 0.3); }
      footer { margin-top: 56px; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.06); text-align: center; font-size: 12px; color: rgba(148, 163, 184, 0.7); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back-btn" href="marketing.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back to Marketing Projects
      </a>
      <header>
        <div class="eyebrow">Marketing Project</div>
        <h1>Actax</h1>
      </header>
      <div class="panel">
        <span class="tag">Coming soon</span>
        <p>Project details for Actax will be added here soon.</p>
      </div>
      <footer>© <span id="yr"></span> Mannat. All rights reserved.</footer>
    </div>
    <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
  </body>
</html>
